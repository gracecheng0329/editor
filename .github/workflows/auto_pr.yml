name: Auto PR

on:
   push:
      branches-ignore:
         - main
   workflow_dispatch:
      inputs:
         issue_number:
            description: Issue number (optional override when references are ambiguous)
            required: false
            type: string

permissions:
   contents: read
   issues: read
   pull-requests: write

# Enable Settings > Actions > General > Allow GitHub Actions to create and
# approve pull requests, or configure AUTO_PR_TOKEN with Contents/Issues: read
# and Pull requests: write. Code review runs locally before pushing.
concurrency:
   group: auto-pr-${{ github.ref }}
   cancel-in-progress: false

jobs:
   auto-pr:
      if: github.event.deleted != true && github.ref_name != 'main'
      runs-on: ubuntu-latest
      timeout-minutes: 10
      env:
         BASE_BRANCH: main
         HEAD_BRANCH: ${{ github.ref_name }}
         GH_REPO: ${{ github.repository }}
         GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || github.token }}
         ISSUE_NUMBER: ${{ inputs.issue_number }}
      steps:
         - name: Checkout code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0
              persist-credentials: false

         - name: Validate PR automation
           run: python3 -m unittest discover -s scripts -p 'test_auto_pr.py'

         - name: Create or update PR with pr skill
           env:
              OPENAI_API_KEY: ${{ secrets.OPENAI }}
              AUTO_PR_BODY_MODEL: ${{ vars.AUTO_PR_BODY_MODEL || 'gpt-4o-mini' }}
              PR_SKILL_PATH: .agents/skills/pr/SKILL.md
           run: python3 scripts/auto_pr.py sync
